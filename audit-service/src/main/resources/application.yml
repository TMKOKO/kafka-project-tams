server:
  port: 8080

spring:
  application:
    name: audit-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
    listener:
      type: batch
      ack-mode: manual
    consumer:
      group-id: audit-archiver-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 500
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        auto.offset.reset: earliest
        enable.auto.commit: false
        max.poll.interval.ms: 300000
        fetch.min.bytes: 65536
        fetch.max.wait.ms: 500
        max.partition.fetch.bytes: 1048576
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    # This producer only writes to the DLQ, so it favours durability over speed.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        retries: 2147483647
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 20
        batch.size: 65536
        delivery.timeout.ms: 60000
        request.timeout.ms: 10000

audit:
  file: ${AUDIT_FILE:/data/audit/audit-log.jsonl}

management:
  endpoints:
    web:
      exposure:
        include: health
