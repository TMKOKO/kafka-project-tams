---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
spec:
  # One replica: the archive is a single file on a ReadWriteOnce volume. See the scalability notes in the doc.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      enableServiceLinks: false
      containers:
        - name: app
          image: payments/audit-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: audit-data
              mountPath: /data/audit
      volumes:
        - name: audit-data
          persistentVolumeClaim:
            claimName: audit-data
